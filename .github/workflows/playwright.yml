name: Playwright Tests
env:
  # the below will be 'true'
  HAS_NEW_VERSION: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message), '#skip') }}
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize]
jobs:
  testanddeploy:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Failed message
      if: ${{ cancelled() }}
      uses: discord-actions/message@v2
      with:
        webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
        message: "Build failed"
    - name: Trigger deployment
      if: ${{ env.HAS_NEW_VERSION == 'true' }}
      run: curl https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}  
  tag_release:
    needs: [testanddeploy]
    runs-on: ubuntu-latest    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Install dependencies
      run: npm ci    
    - name: Bump version and push tag
      if: ${{ env.HAS_NEW_VERSION == 'true' }}
      uses: anothrNick/github-tag-action@1.64.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BUMP: patch
  successmessage:
    needs: [testanddeploy]
    uses: discord-actions/message@v2
    with:
      webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
      message: "New version deployed -js"